# Lint and type-check the pure-Python conversion and validation packages and their tests.
# The pattern deliberately leaves the rest of the repository's existing files untouched.
files: ^(sbol_utilities/(convert|validation)/.*|sbol_utilities/(identifiers|rdf_io|vocab)\.py|test/(test_(convert|validation)_.*|sboltestsuite|conftest|validation_goldens|conversion_goldens)\.py)$
repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "120"]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length", "120"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--follow-imports=silent"]
        additional_dependencies: ["types-requests"]
